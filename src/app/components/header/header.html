<header class="header">
  <div class="header-inner">
    <a routerLink="/" class="brand" (click)="closeMenu()">
      <span class="brand-mark">SBAR<span class="brand-plus">+</span></span>
      <span class="brand-sub">Portfólio de Estágio</span>
    </a>

    <button class="menu-toggle" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()" aria-label="Abrir menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="nav" [class.open]="menuOpen()">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          (click)="closeMenu()"
        >{{ link.label }}</a>
      }
    </nav>
  </div>
</header>
